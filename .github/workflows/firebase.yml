
# This file enables automatic deployments to Firebase App Hosting.
#
# To connect your GitHub repository to Firebase, you need to add two secrets
# in your repository's settings:
#
# 1. FIREBASE_SERVICE_ACCOUNT_STUDIO_1618913228_905EC: A service account key with permissions to deploy.
#    You can generate this from your Google Cloud project settings.
#
# 2. FIREBASE_APP_ID: Your Firebase App ID.
#
# For more information, visit:
# https://firebase.google.com/docs/hosting/github-integration

name: Deploy to Firebase App Hosting
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDIO_1618913228_905EC }}'
          projectId: 'studio-1618913228-905ec'
